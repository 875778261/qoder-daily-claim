name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify VERSION matches tag
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath 'skills/qoder-daily-claim/VERSION').Trim()
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -ne $tag) {
            throw "VERSION ($version) does not match tag ($tag). Update skills/qoder-daily-claim/VERSION before tagging."
          }
          Write-Host "VERSION $version matches tag $($env:GITHUB_REF_NAME)"

      - name: Package skill
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME --generate-notes --verify-tag (Get-ChildItem -Path dist -File).FullName
